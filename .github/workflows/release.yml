# Выпуск по тегу v*: проверки → подписанные сборки агента (scripts/release.sh) и SDK (архив
# Node, пакет Python) → один GitHub Release; образы в GHCR: agent:<версия>-python,
# agent-dist:<версия>. Всё ставится с GitHub — без npm и PyPI. Секрет AGENT_SIGNING_KEY —
# base64 seed Ed25519 (agent keygen), обязателен; публичный ключ — в конфигурацию агентов.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # То же, что make vet, race, sdk-test, examples-test, — и версия совпадает с тегом.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия совпадает с тегом и везде одинаковая
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" && scripts/version.sh check
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install websockets cryptography
      - name: SDK Node
        working-directory: sdk/node
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: SDK Python
        working-directory: sdk/python
        run: python -m unittest discover -s tests -t .
      - name: Примеры
        run: |
          (cd examples/server && npm ci && npm run typecheck && npm test)
          (cd examples/workers/node && npm ci && npm run typecheck)
          (cd examples/web && npm ci && npm run build)
          python -m unittest discover -s examples/server-python/tests -t examples/server-python
      - run: go vet ./...
      # Агент, Go-SDK, эталоны, integration, conformance (серверы на Go, Node, Python).
      - run: go test -race ./...

  # Выпуск агента: сборки linux/darwin × amd64/arm64, manifest.json с подписями, install.sh.
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Сборки и manifest
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          test -n "$AGENT_SIGNING_KEY" || { echo "нет секрета AGENT_SIGNING_KEY: выпуск без подписи не публикуется" >&2; exit 1; }
          v=$(cat VERSION)
          scripts/release.sh "dist/$v" "$v"
          mkdir -p out && cp "dist/$v"/* out/
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: out/*
          if-no-files-found: error

  # SDK: Node — архив npm (agent-sdk-<версия>.tgz, с собранным dist), Python — wheel и sdist.
  sdk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: SDK Node
        working-directory: sdk/node
        run: |
          npm ci && npm run lint && npm run typecheck && npm test
          mkdir -p ../../out && npm pack --pack-destination ../../out
      - name: SDK Python
        run: |
          pip install websockets cryptography build
          (cd sdk/python && python -m unittest discover -s tests -t .)
          python -m build sdk/python --outdir out
      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: out/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build, sdk]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true

  images:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - file: deploy/Dockerfile
            image: agent
            suffix: "-python"
          - file: deploy/Dockerfile.dist
            image: agent-dist
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            agent_signing_key=${{ secrets.AGENT_SIGNING_KEY }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
