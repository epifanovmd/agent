# Выпуск по тегу v*: проверки → подписанные сборки агента (scripts/release.sh) и архив
# серверного SDK (npm pack) → один GitHub Release; образы в GHCR: agent:<версия> (минимальный),
# agent:<версия>-python (с python3 для воркеров), agent-dist:<версия>. Всё ставится с GitHub —
# без npm. Тег с «-» (v1.2.0-rc.1) — предварительный выпуск.
# Нужны в настройках репозитория (agent-release keygen выдаёт пару):
#   секрет AGENT_SIGNING_KEY — закрытый ключ подписи (base64 seed Ed25519);
#   переменная AGENT_UPDATE_PUBLIC_KEY — открытый ключ: вшивается в сборки агента,
#   чтобы они проверяли обновления без настройки update.publicKey.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # То же, что make vet, race, sdk-test, examples-test, e2e, — и версия совпадает с тегом.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Версия совпадает с тегом и везде одинаковая
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" && scripts/version.sh check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: SDK Node
        working-directory: sdk/node
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: Примеры
        run: |
          (cd examples/server && npm ci && npm run lint && npm run typecheck)
          node --check examples/workers/node-echo/main.mjs
          python3 -m py_compile examples/workers/echo/main.py
      - run: go vet ./...
      # Агент, образцы сообщений, integration (сервер на agent-sdk/server).
      - run: go test -race ./...
      - name: Сквозные тесты стенда
        run: scripts/e2e.sh

  # Выпуск агента: сборки linux/darwin × amd64/arm64, manifest.json с подписями, install.sh.
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Сборки и manifest
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
          AGENT_UPDATE_PUBLIC_KEY: ${{ vars.AGENT_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$AGENT_SIGNING_KEY" || { echo "нет секрета AGENT_SIGNING_KEY: выпуск без подписи не публикуется" >&2; exit 1; }
          test -n "$AGENT_UPDATE_PUBLIC_KEY" || { echo "нет переменной AGENT_UPDATE_PUBLIC_KEY: открытый ключ вшивается в сборки" >&2; exit 1; }
          v=$(cat VERSION)
          scripts/release.sh "dist/$v" "$v"
          mkdir -p out && cp "dist/$v"/* out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: out/*
          if-no-files-found: error

  # Серверный SDK — архив npm (agent-sdk-<версия>.tgz, с собранным dist).
  sdk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: SDK Node
        working-directory: sdk/node
        run: |
          npm ci && npm run lint && npm run typecheck && npm test
          mkdir -p ../../out && npm pack --pack-destination ../../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk
          path: out/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build, sdk]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  images:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - file: deploy/Dockerfile
            target: agent
            image: agent
            suffix: ""
          - file: deploy/Dockerfile
            target: agent-python
            image: agent
            suffix: "-python"
          - file: deploy/Dockerfile.dist
            target: ""
            image: agent-dist
            suffix: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            agent_signing_key=${{ secrets.AGENT_SIGNING_KEY }}
          build-args: |
            AGENT_UPDATE_PUBLIC_KEY=${{ vars.AGENT_UPDATE_PUBLIC_KEY }}
          cache-from: type=gha,scope=release-${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}${{ matrix.suffix }}
