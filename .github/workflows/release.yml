# Публикация версии по тегу v*: проверки → подписанные сборки агента (scripts/release.sh) → GitHub
# Release — каталог сборок агента по умолчанию (update.releases): агенты находят новую версию в
# нём сами. Образы в GHCR: agent:<версия> (минимальный), agent:<версия>-python (с python3 для
# воркеров), agent-dist:<версия>. Тег с «-» (v1.2.0-rc.1) — предварительная версия.
# Нужны в настройках репозитория (пара ключей — docs/ARCHITECTURE.md, «Ключи подписи»):
#   секрет AGENT_SIGNING_KEY — закрытый ключ подписи (base64 seed Ed25519);
#   переменная AGENT_UPDATE_PUBLIC_KEY — открытый ключ (base64): вшивается в сборки агента,
#   чтобы они проверяли обновления без настройки update.publicKey.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # То же, что make vet, race, examples-test, e2e, — и версия совпадает с тегом.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Версия совпадает с тегом
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" && scripts/version.sh check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Синтаксис примеров на Python
        run: python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' examples/workers/echo/main.py examples/server/server.py
      - run: go vet -tags e2e ./...
      - name: Известные уязвимости (код и стандартная библиотека Go)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test -race ./...
      - name: Сквозные тесты
        run: go test -tags e2e -count=1 -timeout 10m ./test/e2e/

  # Сборки агента linux/darwin × amd64/arm64 (agent-<os>-<arch>), manifest.json с подписями и
  # его publicKey, install.sh.
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Сборки и manifest
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
          AGENT_UPDATE_PUBLIC_KEY: ${{ vars.AGENT_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$AGENT_SIGNING_KEY" || { echo "нет секрета AGENT_SIGNING_KEY: сборки без подписи не публикуются" >&2; exit 1; }
          test -n "$AGENT_UPDATE_PUBLIC_KEY" || { echo "нет переменной AGENT_UPDATE_PUBLIC_KEY: открытый ключ вшивается в сборки" >&2; exit 1; }
          v=$(cat VERSION)
          scripts/release.sh "dist/$v" "$v"
          mkdir -p out && cp "dist/$v"/* out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: out/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      # Только артефакты для публикации: build-push-action добавляет свои (.dockerbuild).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent
          path: out
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  images:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - file: deploy/Dockerfile
            target: agent
            image: agent
            suffix: ""
          - file: deploy/Dockerfile
            target: agent-python
            image: agent
            suffix: "-python"
          - file: deploy/Dockerfile.dist
            target: ""
            image: agent-dist
            suffix: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            agent_signing_key=${{ secrets.AGENT_SIGNING_KEY }}
          build-args: |
            AGENT_UPDATE_PUBLIC_KEY=${{ vars.AGENT_UPDATE_PUBLIC_KEY }}
          cache-from: type=gha,scope=release-${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}${{ matrix.suffix }}
