name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Агент, образцы сообщений, integration (сервер на agent-sdk/server). Без node или
  # собранного sdk/node интеграционные тесты в CI падают.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: sdk/node
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt: не отформатированы:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  # Младшая версия Go из строки go в go.mod: модуль собирается ей.
  go-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: go vet ./...
        env:
          GOTOOLCHAIN: local

  # Известные уязвимости в коде агента и в стандартной библиотеке Go, которой он собирается.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Серверный SDK, стенд, версия, форматирование.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Версия везде одинаковая
        run: scripts/version.sh check
      - name: Prettier
        run: npm ci && npx prettier --check .
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: sdk/node
      - run: npm ci && npm run lint && npm run typecheck
        working-directory: examples/server
      - name: Синтаксис воркеров стенда на Node и Python
        run: node --check examples/workers/node-echo/main.mjs && python3 -m py_compile examples/workers/echo/main.py

  # Сквозные тесты стенда: сервер на agent-sdk/server, настоящий агент, воркеры-примеры.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: sdk/node
      - run: scripts/e2e.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck deploy/install/install.sh scripts/*.sh

  images:
    runs-on: ubuntu-latest
    needs: go
    strategy:
      matrix:
        include:
          - name: agent
            file: deploy/Dockerfile
            target: agent
          - name: python
            file: deploy/Dockerfile
            target: agent-python
          - name: dist
            file: deploy/Dockerfile.dist
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
