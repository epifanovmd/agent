name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Агент, Go-SDK, эталоны сообщений, integration, conformance (серверы на Go, Node, Python).
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Node — для test/conformance (сервер examples/server на agent-sdk).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: sdk/node
      - run: npm ci
        working-directory: examples/server
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt: не отформатированы:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  # Младшая версия Go из строки go в go.mod: модуль и Go-SDK собираются ей.
  go-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: go vet ./...
        env:
          GOTOOLCHAIN: local

  # SDK Python и бэкенд-пример на нём: младшая и старшая поддерживаемые версии.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Необязательные зависимости SDK: адаптер websockets, agents.seal.
      - run: pip install websockets cryptography
      - run: python -m unittest discover -s tests -t .
        working-directory: sdk/python
      - run: python -m unittest discover -s examples/server-python/tests -t examples/server-python

  # SDK Node, примеры на Node, версия, форматирование.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Версия везде одинаковая
        run: scripts/version.sh check
      - name: Prettier
        run: npm ci && npx prettier --check .
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: sdk/node
      - run: npm ci && npm run typecheck && npm test
        working-directory: examples/server
      - run: npm ci && npm run typecheck
        working-directory: examples/workers/node
      - run: npm ci && npm run build
        working-directory: examples/web

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck deploy/install/install.sh scripts/*.sh

  images:
    runs-on: ubuntu-latest
    needs: go
    strategy:
      matrix:
        include:
          - name: python
            file: deploy/Dockerfile
          - name: dist
            file: deploy/Dockerfile.dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
