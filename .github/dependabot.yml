# Обновления зависимостей: раз в неделю, по одному запросу на каталог.
version: 2
updates:
  # Агент (go.mod в корне).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # SDK, стенд, Prettier репозитория.
  - package-ecosystem: npm
    directories:
      - /
      - /sdk/node
      - /examples/server
    schedule:
      interval: weekly

  # Действия CI и выпуска.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
