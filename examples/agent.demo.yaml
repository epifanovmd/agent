# Агент стенда: сервер examples/server/server.py и два воркера-примера. ${…} подставляет
# scripts/demo.sh. Второй агент — DEMO_AGENT=2: свой каталог данных и своё имя.
server:
  url: ${AGENT_SERVER_URL}
  # Сервер стенда — http:// на этой машине; на узлах — только https://.
  allowInsecure: true
dataDir: ${DEMO_ROOT}/.dev/demo-agent-${DEMO_AGENT}
name: demo-${DEMO_AGENT}
labels:
  env: demo
enroll:
  token: ${AGENT_ENROLL_TOKEN}
# Агент стенда себя не обновляет.
update:
  mode: disabled
# Бэкенду — записи журнала с info; watch в желаемом может сделать подробнее.
log:
  forward: info
workers:
  # Python, стандартная библиотека: настройка settings, команды echo.say, echo.long (ход, отмена,
  # busy), echo.hang; событие echo.said; запрос к бэкенду echo.lookup.
  - name: echo
    command: ["python3", "examples/workers/echo/main.py"]
    dir: ${DEMO_ROOT}
    # После SIGTERM агент ждёт выхода stopTimeout (по умолчанию 30s), потом SIGKILL.
    lifecycle:
      stopTimeout: 10s
  # Go, клиент github.com/epifanovmd/agent/worker: настройка banner, команда sys.info, событие
  # sys.started, метрики процесса в пульсе.
  - name: sysinfo
    command: ["${SYSINFO_BIN}"]
