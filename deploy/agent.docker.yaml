# Агент в контейнере — база для образов проектов. Адрес сервера — AGENT_SERVER_URL,
# токен регистрации — AGENT_ENROLL_TOKEN, имя — AGENT_NAME (по умолчанию hostname).
# Воркеры задаёт образ проекта своим agent.yaml (COPY agent.yaml /etc/agent/agent.yaml).
server:
  url: ${AGENT_SERVER_URL}
dataDir: /var/lib/agent
update:
  mode: external
log:
  level: ${AGENT_LOG_LEVEL}
  format: json
workers: []
