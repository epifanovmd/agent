# Боевые узлы: этот файл поверх agent.yaml (воркеры — оттуда же).
# Упаковать для переноса: ./agent pack --env prod; поставить на узле: sudo ./agent install --env prod
# Адрес бэкенда, токен и ключи — в .env.prod (в git не попадает); он важнее .env.
extends: agent.yaml
envFiles: [.env.prod]

# На узле агент обновляет себя по команде сервера (подпись проверяется, неудачная версия откатывается).
update:
  mode: self

# Журнал — строками JSON для систем сбора логов.
log:
  format: json
